<!-- ===== GİRİŞ ===== -->
<div class="login" id="loginScreen">
  <div class="login-card">
    <div class="login-brand"><img src="assets/baksana-mark.png" alt=""><b>BAKSANA</b><span>Admin</span></div>
    <form class="login-box" id="loginForm" novalidate>
      <h1>Yönetim paneline giriş</h1>
      <p>Yalnızca BAKSANA yönetici hesapları giriş yapabilir.</p>
      <div class="alert alert-error" id="loginError" role="alert" hidden></div>
      <div class="field"><label class="label" for="loginEmail">E-posta</label><input class="input" id="loginEmail" type="email" autocomplete="username" inputmode="email" required></div>
      <div class="field"><label class="label" for="loginPassword">Şifre</label><input class="input" id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg btn-block" id="loginBtn" type="submit">Giriş yap</button>
    </form>
    <div class="login-foot">BAKSANA Yönetim Merkezi</div>
  </div>
</div>

<!-- ===== PANEL ===== -->
<div class="app" id="app">
  <aside class="sidebar" aria-label="Ana menü">
    <div class="side-head">
      <img src="assets/baksana-mark.png" alt="">
      <span class="wordmark">BAKSANA <small>Admin</small></span>
      <button class="icon-btn collapse-btn" id="collapseBtn" type="button" aria-label="Menüyü daralt" title="Menüyü daralt"><svg class="ic"><use href="#i-panel"/></svg></button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="who"><div class="avatar" data-initials>A</div><div class="who-t"><b>Yönetici</b><small data-email></small></div></div>
      <button class="nav-item" type="button" data-action="logout" title="Çıkış yap"><svg class="ic"><use href="#i-logout"/></svg><span class="nav-label">Çıkış yap</span></button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="m-brand"><img src="assets/baksana-mark.png" alt=""><span>BAKSANA</span></div>
      <div class="crumb" id="crumb"></div>
      <label class="top-search"><svg class="ic"><use href="#i-search"/></svg><span class="sr">Sipariş ara</span><input id="topSearch" type="search" placeholder="Sipariş kodu, müşteri, telefon…" autocomplete="off"><kbd>/</kbd></label>
      <div class="top-sep"></div>
      <div class="top-actions">
        <button class="icon-btn" id="topRefresh" type="button" aria-label="Verileri yenile" title="Yenile"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="bellBtn" type="button" aria-label="Dikkat gerektirenler" aria-haspopup="true" aria-expanded="false" aria-controls="bellPop"><svg class="ic"><use href="#i-bell"/></svg><span class="dot-count" id="bellCount" hidden>0</span></button>
        <button class="icon-btn" id="meBtn" type="button" aria-label="Hesap menüsü" aria-haspopup="true" aria-expanded="false" aria-controls="mePop"><span class="avatar" data-initials style="width:28px;height:28px;font-size:12px">A</span></button>
      </div>
      <div class="pop" id="bellPop" role="region" aria-label="Dikkat gerektirenler"></div>
      <div class="pop" id="mePop" role="menu" aria-label="Hesap menüsü">
        <div class="pop-h"><span data-email></span></div>
        <button class="menu-item" type="button" role="menuitem" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg>Ayarlar ve altyapı</button>
        <button class="menu-item danger" type="button" role="menuitem" data-action="logout"><svg class="ic"><use href="#i-logout"/></svg>Çıkış yap</button>
      </div>
    </header>
    <main class="page" id="view" tabindex="-1"></main>
  </div>

  <nav class="bottom" aria-label="Alt menü">
    <button type="button" data-nav="overview"><svg class="ic"><use href="#i-home"/></svg>Genel</button>
    <button type="button" data-nav="orders"><svg class="ic"><use href="#i-orders"/></svg>Siparişler<span class="nav-count" data-count="pending" hidden>0</span></button>
    <button type="button" data-nav="businesses"><svg class="ic"><use href="#i-store"/></svg>İşletmeler</button>
    <button type="button" data-nav="sites"><svg class="ic"><use href="#i-building"/></svg>Siteler</button>
    <button type="button" data-action="more" aria-haspopup="dialog"><svg class="ic"><use href="#i-menu"/></svg>Menü</button>
  </nav>
</div>

<!-- ===== KATMANLAR ===== -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" aria-hidden="true"></aside>
<div class="modal" id="genModal" aria-hidden="true"><div class="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="confirmModal" aria-hidden="true"><div class="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="moreModal" aria-hidden="true"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mmT">
  <div class="modal-h" style="align-items:center;padding-bottom:6px"><div class="avatar" data-initials>A</div><div class="t"><h2 id="mmT">Yönetici</h2><p data-email style="margin:0"></p></div><button class="icon-btn" type="button" data-close aria-label="Kapat"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="sheet-nav" id="moreNav"></div>
</div></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="assets/pages/businesses.js"></script>
<script src="assets/pages/sites.js"></script>
<script src="assets/pages/services.js"></script>
<script src="assets/pages/finance.js"></script>
<script src="assets/pages/audit.js"></script>
<script src="assets/pages/settings.js"></script>
<script src="assets/app.js"></script>
</body>
